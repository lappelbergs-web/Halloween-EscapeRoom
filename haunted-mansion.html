<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Haunted Mansion | Workhub</title>
    <link rel="stylesheet" href="./haunted-mansion.css?v=2">
</head>
<body>
    <main class="haunted-mansion">
        <h1>The Haunted Mansion</h1>
        <p>Welcome to the Haunted Mansion! Get ready for a spine-chilling adventure.</p>
        <section id="offers">
            <h2>Choose Your Experience</h2>
            <div id="offers-container"></div>
        </section>
        
        <p id="total-price">Choose an experience to see the price.</p>
        <form id="booking-form" novalidate>
            <h2>Book Your Experience</h2>

        <label for="quantity">Number of players (1-5)</label>
        <input type="number" id="quantity" name="quantity" min="1" max="5" value="1">

    <label for="customer-name">Your Name</label>
    <input type="text" id="customer-name">
    <p id="name-error"></p>

    <label for="customer-email">Your Email</label>
    <input type="email" id="customer-email">
    <p id="email-error"></p>

    <p id="booking-error"></p>

    <button type="submit">Confirm Booking</button>
    <button type="reset">Reset Booking</button>
</form>

<div id="booking-confirmation"></div>
    </main>

    <script src="haunted-mansion.js"></script>
</body>
</html>
