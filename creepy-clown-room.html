<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creepy Clown Room</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="creepy-clown-room">
        <section class="room-card">
            <a class="back-link" href="index.html">← Tillbaka till startsidan</a>

            <header class="room-header">
                <h1>Creepy Clown Room</h1>
                <p class="room-intro">Välkommen in i cirkusens mörkaste sal. Välj paket, ange timmar och boka ditt äventyr.</p>
            </header>

            <div class="price-panel">
                <h2>Priser</h2>
                <div id="clown-prices" class="offer-cards"></div>
                <p id="total-price" class="total-price"></p>
            </div>

            <div class="booking-panel">
                <h2>Bokning</h2>
                <form id="booking-form" novalidate>
                    <label for="name">Namn:</label>
                    <input type="text" id="name" name="name" autocomplete="name">
                    <p class="field-error" id="name-error"></p>

                    <label for="email">E-postadress:</label>
                    <input type="text" id="email" name="email" autocomplete="email">
                    <p class="field-error" id="email-error"></p>

                    <label for="package-select">Erbjudande:</label>
                    <select name="package" id="package-select">
                        <option value="">--Välj erbjudande--</option>
                    </select>
                    <p class="field-error" id="package-error"></p>

                    <label for="quantity-input">Antal timmar:</label>
                    <input type="text" id="quantity-input" name="quantity" inputmode="numeric" value="1">
                    <p class="field-error" id="quantity-error"></p>

                    <div class="form-actions">
                        <button type="submit" id="confirm-booking">Bekräfta bokning</button>
                        <button type="button" id="start-over">Börja om</button>
                    </div>
                </form>
            </div>

            <div id="booking-summary" class="booking-summary booking-form-hidden">
                <h2>Bokningsbekräftelse</h2>
                <p><strong>Namn:</strong> <span id="summary-name"></span></p>
                <p><strong>E-post:</strong> <span id="summary-email"></span></p>
                <p><strong>Erbjudande:</strong> <span id="summary-offer"></span></p>
                <p><strong>Antal timmar:</strong> <span id="summary-quantity"></span></p>
                <p class="summary-total"><strong>Totalpris:</strong> <span id="summary-total"></span></p>
            </div>
        </section>
        <img
            class="standing-clown-image"
            src="https://png.pngtree.com/png-vector/20240611/ourmid/pngtree-scary-clown-cartoon-creepy-halloween-character-png-image_12686020.png"
            alt=""
        >
        <img
            class="floating-clown-image"
            src="https://png.pngtree.com/png-vector/20230728/ourmid/pngtree-pennywise-face-vector-png-image_6899714.png"
            alt=""
        >
    </main>
    <script src="creepy-clown-room.js"></script>
</body>
</html>
