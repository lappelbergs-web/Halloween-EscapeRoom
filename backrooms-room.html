<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abandoned Asylum | WorkHub Bookings</title>
    <link rel="stylesheet" href="styles.css">
    <style>
       main {
            display: flex;
            align-items: center;
            text-align: center;

        }

        .asylum-header {
            /* Takes up the full width at the top */
            display: flex;
            width: 100%;
            
            /* Optional: keeps it pinned at the top even when scrolling */
            position: sticky; /* or position: fixed; */
            top: 0;
            left: 0;
            z-index: 1000; /* ensures it stays above other content */
        }

        .asylum-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            box-shadow: 0 2px 4px var(--shadow);
        }

        .asylum-nav-links {
            list-style: none;
            padding: 0;
            margin: 0; 
            display: flex;
            gap: 25px;
            list-style: none;
        }
        /* Center the main container horizontally and vertically */
        .booking-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 400px;
            margin: 3rem auto;
            text-align: center;
        }

        /* Stack the form and set full width */
        #asylumBookingForm {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Stack label above input and center them */
        .form-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
        }

        /* Make inputs uniform */
        .form-group input,
        .form-group select,
        #asylumSubmitBtn {
            width: 100%;
            max-width: 300px;
            box-sizing: border-box;
        }

        /* Keep summary hidden until needed */
        .summary-section.hidden {
            display: none !important;
        }

        /* Center summary section when visible */
        .summary-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
    </style>
</head>
<body>
  <header class="asylum-header">
    <nav class="asylum-nav">
      <a href="index.html" class="asylum-nav-logo">WorkHub</a>
      <ul class="asylum-nav-links">
        <li><a href="room1.html">1escaperoom</a></li>
        <li><a href="room2.html">2escaperoom</a></li>
        <li><a href="room3.html">3escaperoom</a></li>
        <li><a href="room4.html">4escaperoom</a></li>
      </ul>
    </nav>
  </header>

  <main class="booking-container">
    <h2>Bokningsförfrågan – Abandoned Asylum</h2>

    <!-- Form Section -->
    <form id="asylumBookingForm" novalidate>
      <div class="form-group">
        <label for="asylumOfferSelect">Välj erbjudande:</label>
        <select id="asylumOfferSelect" name="offer">
          <option value="">Välj ett erbjudande</option>
        </select>
      </div>

      <div class="form-group">
        <label for="asylumQuantityInput">Antal paket (1-5):</label>
        <input type="number" id="asylumQuantityInput" name="quantity" min="1" max="5" value="1">
      </div>

      <div class="form-group">
        <label for="asylumNameInput">Namn:</label>
        <input type="text" id="asylumNameInput" name="name" placeholder="Ditt namn">
      </div>

      <div class="form-group">
        <label for="asylumEmailInput">E-post:</label>
        <input type="email" id="asylumEmailInput" name="email" placeholder="din.epost@example.com">
      </div>

      <div id="asylumPriceDisplay" class="price-display">Totalpris: 0 kr</div>
      <div id="asylumErrorMessage" class="error-message"></div>

      <button type="submit" id="asylumSubmitBtn">Skicka förfrågan</button>
      <button type="button" id="asylumResetBtn">Börja om</button>
    </form>

    <!-- Summary Section (Hidden initially) -->
    <section id="asylumSummarySection" class="summary-section hidden">
      <h3>Bokningssammanfattning</h3>
      <p><strong>Namn:</strong> <span id="asylumSummaryName"></span></p>
      <p><strong>E-post:</strong> <span id="asylumSummaryEmail"></span></p>
      <p><strong>Erbjudande:</strong> <span id="asylumSummaryOffer"></span></p>
      <p><strong>Antal paket:</strong> <span id="asylumSummaryQuantity"></span></p>
      <p><strong>Totalt:</strong> <span id="asylumSummaryTotal"></span></p>
    </section>
  </main>
    <script src="leo-script.js"></script>
</body>
</html>
